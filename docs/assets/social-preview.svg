<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="Panel Passkeys: passkey sign-in for Pterodactyl">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0b14"/>
      <stop offset=".55" stop-color="#121027"/>
      <stop offset="1" stop-color="#071a24"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.18" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#7c5cff" stop-opacity=".35"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.9" cy="0.95" r="0.55">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".25"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".04" stroke-width="1"/>
    </pattern>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c5cff"/><stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <mask id="cut"><rect width="256" height="256" fill="#fff"/><circle cx="184" cy="184" r="42" fill="#000"/></mask>
  </defs>
  <rect width="1280" height="640" fill="url(#sky)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <rect width="1280" height="640" fill="url(#glow1)"/>
  <rect width="1280" height="640" fill="url(#glow2)"/>
  <!-- logo -->
  <g transform="translate(548 70) scale(.72)">
    <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)"/>
    <g mask="url(#cut)" fill="none" stroke="#0b0b14" stroke-opacity=".9" stroke-width="11" stroke-linecap="round" stroke-linejoin="round">
      <path d="M104 158 V114 A12 12 0 0 1 128 114 V128"/>
      <path d="M88 144 V114 A28 28 0 0 1 144 114 V136 Q144 156 136 170"/>
      <path d="M72 128 V114 A44 44 0 0 1 77.9 92"/>
      <path d="M88.9 79.3 A44 44 0 0 1 160 114 V140"/>
      <path d="M56 138 V114 A60 60 0 0 1 162 75.4"/>
      <path d="M170.8 89.6 A60 60 0 0 1 175.7 107.7"/>
    </g>
    <circle cx="184" cy="184" r="32" fill="#0b0b14"/>
    <path d="M170 185 l10 10 19 -21" fill="none" stroke="#34d399" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" text-anchor="middle">
    <text x="640" y="350" font-size="84" font-weight="800" fill="#fafafa" letter-spacing="-2">Panel <tspan fill="url(#accent)">Passkeys</tspan></text>
    <text x="640" y="406" font-size="30" fill="#c4c4d4">Passkey sign-in for Pterodactyl. No password, no code.</text>
    <g font-size="18" font-weight="600" fill="#e4e4f0">
      <g transform="translate(160 448)"><rect width="346" height="42" rx="21" fill="#ffffff" fill-opacity=".07" stroke="#ffffff" stroke-opacity=".14"/><text x="173" y="28">Face ID · Touch ID · Windows Hello</text></g>
      <g transform="translate(520 448)"><rect width="200" height="42" rx="21" fill="#ffffff" fill-opacity=".07" stroke="#ffffff" stroke-opacity=".14"/><text x="100" y="28">Phishing-resistant</text></g>
      <g transform="translate(734 448)"><rect width="166" height="42" rx="21" fill="#ffffff" fill-opacity=".07" stroke="#ffffff" stroke-opacity=".14"/><text x="83" y="28">Counts as 2FA</text></g>
      <g transform="translate(914 448)"><rect width="206" height="42" rx="21" fill="#ffffff" fill-opacity=".07" stroke="#ffffff" stroke-opacity=".14"/><text x="103" y="28">Free &amp; open source</text></g>
    </g>
    <text x="640" y="566" font-size="20" fill="#8b8ba3">github.com/jackh54/pterodactyl-panel-passkeys · Pterodactyl Panel 2.0 extension</text>
  </g>
</svg>
