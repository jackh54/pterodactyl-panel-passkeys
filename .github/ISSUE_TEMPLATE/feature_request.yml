name: Feature request
description: A new setting or improvement
labels: [enhancement]
body:
  - type: textarea
    id: job
    attributes:
      label: What should users or admins be able to do?
      description: Describe it in plain words, e.g. "require a passkey for every administrator".
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could it work?
      description: A setting, a change to the account page, a command...
